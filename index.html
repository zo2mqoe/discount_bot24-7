<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Roblox Shop & Payment</title>
    <style>
        .shop-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .product-card { border: 1px solid #ccc; padding: 10px; text-align: center; border-radius: 8px; }
        .product-card.selected { border-color: #007bff; background-color: #e7f1ff; }
        .popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 2px solid #000; z-index: 100; }
    </style>
</head>
<body>

    <h2>เลือกซื้อไอเทมเข้าเกม (เลือกได้หลายชิ้น)</h2>
    <div class="shop-container" id="shop"></div>
    
    <br>
    <button id="nextBtn" onclick="openPaymentModal()">ถัดไป (ดูตะกร้าสินค้า)</button>

    <!-- หน้าต่างป็อปอัพจ่ายเงิน -->
    <div id="paymentModal" class="popup">
        <h3>สรุปรายการสั่งซื้อ</h3>
        <div id="orderSummary"></div>
        <h4>ราคารวมทั้งสิ้น: <span id="totalPrice">0</span> บาท</h4>
        <hr>
        <p>เลือกช่องทางชำระเงิน:</p>
        <button onclick="payWithTrueMoney()">ซอง TrueMoney Wallet</button>
        <button onclick="payWithBank()">QR Code ธนาคาร</button>
        
        <div id="paymentInstruction" style="margin-top: 15px;"></div>
        <button onclick="closeModal()">ปิดหน้าต่าง</button>
    </div>

    <!-- หน้าต่างรับโค้ดเมื่อจ่ายเงินสำเร็จ -->
    <div id="successModal" class="popup">
        <h3 style="color: green;">🎉 ชำระเงินสำเร็จ!</h3>
        <p>นำโค้ดนี้ไปกรอกในเกมเพื่อรับไอเทมของคุณ:</p>
        <input type="text" id="giftCodeInput" readonly style="font-size: 20px; text-align: center; width: 80%;">
        <button onclick="copyCode()">คัดลอกโค้ด</button>
    </div>

    <script>
        // จำลองข้อมูลของ 20 ชิ้นในร้านค้า
        const products = [];
        for (let i = 1; i <= 20; i++) {
            products.push({ id: i, name: `ไอเทมชิ้นที่ ${i}`, price: i * 10 }); // ราคาตามชิ้น เช่น ชิ้นที่ 1 = 10บ., ชิ้นที่ 5 = 50บ.
        }

        let cart = [];

        // สร้างแสดงผลสินค้า 20 ชิ้น
        const shopDiv = document.getElementById('shop');
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.id = `product-${p.id}`;
            card.innerHTML = `<h4>${p.name}</h4><p>ราคา: ${p.price} บาท</p><button onclick="toggleSelect(${p.id})">เลือก</button>`;
            shopDiv.appendChild(card);
        });

        function toggleSelect(id) {
            const index = cart.indexOf(id);
            const card = document.getElementById(`product-${id}`);
            if (index > -1) {
                cart.splice(index, 1);
                card.classList.remove('selected');
            } else {
                cart.push(id);
                card.classList.add('selected');
            }
        }

        function calculateTotal() {
            return cart.reduce((sum, id) => sum + products.find(p => p.id === id).price, 0);
        }

        function openPaymentModal() {
            if(cart.length === 0) return alert("กรุณาเลือกสินค้าอย่างน้อย 1 ชิ้น!");
            document.getElementById('paymentModal').style.display = 'block';
            
            const summaryText = cart.map(id => products.find(p => p.id === id).name).join(', ');
            document.getElementById('orderSummary').innerText = "สินค้าที่เลือก: " + summaryText;
            document.getElementById('totalPrice').innerText = calculateTotal();
        }

        // กรณีเลือก TrueMoney
        function payWithTrueMoney() {
            const total = calculateTotal();
            const instruction = `
                <div style="background: #fff3cd; padding: 10px; border: 1px solid #ffeeba;">
                    <strong>วิธีเติมเงินด้วยซอง:</strong><br>
                    1. เข้าแอป TrueMoney Wallet -> เลือก "ส่งซองของขวัญ"<br>
                    2. ใส่จำนวนเงินรวมให้ตรงเป๊ะ: <strong>${total} บาท</strong><br>
                    3. เลือกประเภทซอง: "แบ่งจำนวนเงินเท่ากัน" และใส่จำนวนคนรับ: "1 คน"<br>
                    4. คัดลอกลิงก์ซองมาวางด้านล่างนี้:<br>
                    <input type="text" id="vouchUrl" placeholder="https://gift.truemoney.com/...">
                    <button onclick="submitTrueMoney()">ยืนยันส่งซอง</button>
                </div>
            `;
            document.getElementById('paymentInstruction').innerHTML = instruction;
        }

        // กรณีเลือกธนาคาร (ล็อคราคา)
        function payWithBank() {
            const total = calculateTotal();
            const instruction = `
                <div style="background: #d4edda; padding: 10px; border: 1px solid #c3e6cb;">
                    <strong>สแกน QR Code เพื่อชำระเงิน (ระบบล็อคยอดเงินแล้ว)</strong><br>
                    <p style="font-size: 18px; color: red;">ยอดเงินที่ต้องโอน: ${total}.00 บาท</p>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=PromptPayDataHere" alt="QR Code"><br>
                    <p>เมื่อโอนเสร็จแล้ว ระบบจะตรวจสอบอัตโนมัติ (หรือกดยืนยันด้านล่าง)</p>
                    <button onclick="simulateBankSuccess()">[จำลอง] โอนเงินเสร็จแล้ว</button>
                </div>
            `;
            document.getElementById('paymentInstruction').innerHTML = instruction;
        }

        // ส่งลิงก์ซองไปตรวจหลังบ้าน
        async function submitTrueMoney() {
            const url = document.getElementById('vouchUrl').value;
            // ดึงรายชื่อสินค้าที่เลือกส่งไปด้วย
            const itemNames = cart.map(id => products.find(p => p.id === id).name);

            const res = await fetch('/api/pay/truemoney', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ voucherUrl: url, phoneNumber: '0900000000', items: itemNames, expectedAmount: calculateTotal() })
            });
            const data = await res.json();
            if(data.success) {
                showSuccessCode(data.code);
            } else {
                alert(data.message);
            }
        }

        function simulateBankSuccess() {
            // ในระบบจริง Webhook ธนาคารจะตรวจสลิปแล้วสร้างโค้ดให้อัตโนมัติ 
            // ตัวอย่างนี้จำลองการคอลไปรับโค้ดหลังโอนเงินสำเร็จ
            const itemNames = cart.map(id => products.find(p => p.id === id).name);
            fetch('/api/pay/bank-success', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ items: itemNames, amount: calculateTotal() })
            }).then(res => res.json()).then(data => {
                showSuccessCode(data.code);
            });
        }

        function showSuccessCode(code) {
            document.getElementById('paymentModal').style.display = 'none';
            document.getElementById('successModal').style.display = 'block';
            document.getElementById('giftCodeInput').value = code;
        }

        function copyCode() {
            const copyText = document.getElementById("giftCodeInput");
            copyText.select();
            document.execCommand("copy");
            alert("คัดลอกโค้ดเรียบร้อย: " + copyText.value);
        }

        function closeModal() { document.getElementById('paymentModal').style.display = 'none'; }
    </script>
</body>
</html>
